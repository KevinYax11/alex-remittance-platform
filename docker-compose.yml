version: "3.9"

services:
  db:
    image: postgres:15
    container_name: remittance_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: remittance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - remittance_network

  backend:
    build: ./backend
    container_name: remittance_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/remittance_db
      SECRET_KEY: supersecretkey123
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - remittance_network
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: remittance_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - remittance_network

volumes:
  postgres_data:

networks:
  remittance_network:
    driver: bridge